<!--
  MERCHANT VISIT ACTIVITY - LAUNCHER PAGE (GitHub Pages edition)
  Opens the Apps Script form inside this page (no Google banner) and passes Telegram's location to it.
  The ONLY file to edit is config.js (the Web app link).
  No inline scripts or styles: the Content-Security-Policy above allows only the files in this folder.
  This repository is PUBLIC: never put the bot token, PINs, staff lists or merchant data here.
-->
<!-- (v16) "defer": the logo paints at once instead of waiting for telegram.org; the order (boot → config → Telegram → launcher) is kept -->
<script src="boot.js"></script>
<script defer src="config.js"></script>
<script defer src="https://telegram.org/js/telegram-web-app.js"></script>
<script defer src="launcher.js"></script>
</head>
<body>
<div class="ld" id="ld" aria-hidden="true">
  <div class="ldbg" id="ldbg"></div>
  <!-- the sign-in page's own logo (same picture, size, corners, shadow and halos). (v16) It springs in at once, the tick
       draws itself, a light sheen passes over the tile and a teal arc runs along the halo while the form loads -->
  <div class="lg" id="lg">
    <i class="h h1" id="h1"></i><i class="h h2" id="h2"></i>
    <svg class="ring" id="ring" viewBox="0 0 132 132" aria-hidden="true" focusable="false"><circle class="ra" cx="66" cy="66" r="65.5" pathLength="100"/></svg>

  </div>
</div>
<iframe id="app" title="Merchant Visit Activity" allow="geolocation *; camera *; clipboard-read *; clipboard-write *; web-share *"></iframe>
