<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="favDisc" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#004d80" />
      <stop offset="50%" stop-color="#002b48" />
      <stop offset="100%" stop-color="#001424" />
    </radialGradient>
    <linearGradient id="favRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="favScallopDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00b58e" />
      <stop offset="100%" stop-color="#006b52" />
    </linearGradient>
    <linearGradient id="favScallopLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="favBadge" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </radialGradient>
  </defs>

  <!-- Base Circular Disc -->
  <circle cx="24" cy="24" r="22" fill="url(#favDisc)" />
  <circle cx="24" cy="24" r="22" stroke="url(#favRim)" stroke-width="0.8" />
  <circle cx="24" cy="24" r="20" stroke="rgba(255,255,255,0.12)" stroke-width="0.5" stroke-dasharray="1.5 1.5" />

  <!-- Store Wall -->
  <rect x="13" y="17" width="22" height="17" rx="1.5" fill="#ffffff" />

  <!-- Door -->
  <rect x="15.5" y="22.5" width="5.5" height="11.5" rx="1" fill="#002b47" />
  <circle cx="19.5" cy="28" r="0.7" fill="#10b981" />

  <!-- Windows -->
  <rect x="23" y="22.5" width="10" height="6" rx="0.8" fill="#002b47" />
  <line x1="28" y1="22.5" x2="28" y2="28.5" stroke="#ffffff" stroke-width="0.8" />

  <!-- Roof Fascia -->
  <rect x="10.5" y="11.5" width="27" height="3" rx="1.5" fill="#ffffff" />

  <!-- Scalloped Awning Stripes (5 segments, total width 25 from x=11.5 to 36.5, width 5 each) -->
  <path d="M 11.5,14 L 16.5,14 L 16.5,18.5 Q 14,21 11.5,18.5 Z" fill="url(#favScallopDark)" />
  <path d="M 16.5,14 L 21.5,14 L 21.5,18.5 Q 19,21 16.5,18.5 Z" fill="url(#favScallopLight)" />
  <path d="M 21.5,14 L 26.5,14 L 26.5,18.5 Q 24,21 21.5,18.5 Z" fill="url(#favScallopDark)" />
  <path d="M 26.5,14 L 31.5,14 L 31.5,18.5 Q 29,21 26.5,18.5 Z" fill="url(#favScallopLight)" />
  <path d="M 31.5,14 L 36.5,14 L 36.5,18.5 Q 34,21 31.5,18.5 Z" fill="url(#favScallopDark)" />

  <!-- Verified Checkmark Badge -->
  <circle cx="35" cy="33" r="7.5" fill="#002238" />
  <circle cx="35" cy="33" r="6.5" fill="url(#favBadge)" />
  <path d="M 31.5,33 L 34,35.5 L 38.5,30.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
